<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/public/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emoji Explorer</title>
  </head>

  <body>

  <main>
    <h1>Emoji Explorer</h1>

    <form id="searchForm">
      <label for="group">Choose a group:</label>
      <select id="group">
        <option value="">Select</option>
        <option value="all">All</option>
        <option value="face positive">Face Positive</option>
        <option value="face neutral">Face Neutral</option>
        <option value="face negative">Face Negative</option>
        <option value="face role">Face Role</option>
        <option value="face sick">Face Sick</option>
        <option value="creature face">Creature Face</option>
        <option value="cat face">Cat Face</option>
        <option value="monkey face">Monkey Face</option>
        <option value="person">Person</option>
        <option value="person role">Person Role</option>
        <option value="person gesture">Person Gesture</option>
      </select>

      <button type="submit">Search</button>
    </form>

    <section id="emojiContainer"></section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
